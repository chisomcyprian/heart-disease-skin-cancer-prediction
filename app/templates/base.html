<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Heart Disease &amp; Skin Cancer Prediction{% endblock %}</title>
  <style>
    :root { --ink: #1c2733; --muted: #5b6b7b; --line: #dde3ea; --bg: #f5f7fa;
            --accent: #0f6e84; --high: #b3372f; --low: #2c7a4b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif;
           color: var(--ink); background: var(--bg); line-height: 1.5; }
    header { background: #fff; border-bottom: 1px solid var(--line); }
    nav { max-width: 860px; margin: auto; padding: 14px 20px;
          display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--accent); }
    nav .brand { font-weight: 700; color: var(--ink); margin-right: auto; }
    main { max-width: 860px; margin: auto; padding: 28px 20px; }
    h1 { margin-top: 0; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 10px;
            padding: 22px; margin-bottom: 20px; }
    .grid { display: grid; gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
    input, select { width: 100%; padding: 9px 10px; font-size: 15px;
                    border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    button, .button { display: inline-block; margin-top: 18px; padding: 10px 22px;
                      font-size: 15px; color: #fff; background: var(--accent);
                      border: 0; border-radius: 6px; cursor: pointer; text-decoration: none; }
    .result.high { border-left: 6px solid var(--high); }
    .result.low { border-left: 6px solid var(--low); }
    .big { font-size: 34px; font-weight: 700; margin: 4px 0; }
    .bar { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
    .bar div { height: 100%; background: var(--accent); }
    .error { color: var(--high); }
    footer { max-width: 860px; margin: auto; padding: 0 20px 30px;
             font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="{{ url_for('home') }}">Heart Disease &amp; Skin Cancer Prediction</a>
      <a href="{{ url_for('heart') }}">Heart</a>
      <a href="{{ url_for('skin') }}">Skin</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    Educational project only. This is not a medical device and must not be used
    for diagnosis. Always consult a qualified doctor.
  </footer>
</body>
</html>
